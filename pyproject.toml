[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nero-assistant"
version = "1.0.0"
description = "Production-grade Voice-First AI Desktop Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NERO Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Desktop Environment :: Voice Assistants",
]
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
    "openai>=1.10.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nero = "main:main"

[tool.setuptools]
py-modules = ["main", "app"]

[tool.setuptools.packages.find]
include = ["automation*", "brain*", "config*", "core*", "platforms*", "security*", "services*", "skills*", "storage*", "ui*", "utils*", "voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
